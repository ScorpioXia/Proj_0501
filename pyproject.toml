[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbar-stability-prediction"
version = "11.0.0"
description = "Lumbar stability prediction from paraspinal muscle MRI and clinical variables"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "xgboost==3.2.0",
  "lightgbm==4.7.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
